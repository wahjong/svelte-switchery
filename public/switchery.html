<!DOCTYPE html>
<html lang="en">

<head>

<body class="cms">

    <form method="post" action="./">

    <h1>Accessible Switchery (Made with Svelte 5)</h1>

    <p>
        <label for="id01">label 01</label>
        <switchery
            data-checkbox-id="id01"
            data-checkbox-name="a"
            data-name="w1"
            onchange="(function(event, detail) {
            });"
        ></switchery>
    </p>

    <p>
        <label for="id02">label02 (disabled)</label>

            disabled

            data-name="w2"
            onchange="(function(event, detail) {
            });"
        ></switchery>
    </p>

    <p>
        <strong id="lab03">label 03</strong>
        <input type="checkbox" id="id03" name="c" checked />

            data-aria-labelledby="lab03"
            data-aria-describedby="des03"
            data-checkbox-id="id03"
            data-checkbox-name="c"
            data-name="w3"
            onchange="(function(event, detail) {
            })"
        ></switchery>

    </p>

    <p>
        <strong id="lab04">label 04 (disabled)</strong>
        <input type="checkbox" id="id04" name="d" checked />
        <switchery
            disabled
            data-aria-labelledby="lab04"
            data-aria-describedby="des04"
            data-checkbox-id="id04"
            data-checkbox-name="d"
            data-name="w4"
            onchange="(function(event, detail) {
            });"
        ></switchery>
