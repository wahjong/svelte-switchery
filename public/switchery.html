<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accessible Switchery (Made with Svelte 5)</title>
    <link rel="shortcut icon" href="#">
</head>

<body class="cms">

    <form method="post" action="./">

    <h1>Accessible Switchery (Made with Svelte 5)</h1>

    <p>
        <label for="id01">id01</label>
        <switchery
            data-checkbox-id="id01"
            data-checkbox-name="a"
            data-name="w1"
            onclick="(function(event, detail) {
                console.log('%cswitchery.onclick', 'background-color:green', JSON.stringify(detail));
            });"
        ></switchery>
    </p>

    <p>
        <label for="id02">id02 (disabled)</label>
        <switchery
            disabled
            data-checkbox-id="id02"
            data-checkbox-name="b"
            data-name="w2"
            onclick="(function(event, detail) {
                console.log('%cswitchery.onclick', 'background-color:green', JSON.stringify(detail))
            });"
        ></switchery>
    </p>

    <p>
        <label for="id03">id03</label>
        <input type="checkbox" id="id03" name="c" checked />
        <switchery
            data-checkbox-id="id03"
            data-checkbox-name="c"
            data-name="w3"
            onclick="(function(event, detail) {
                console.log('%cswitchery.onclick', 'background-color:green', JSON.stringify(detail));
            })"
        ></switchery>
    </p>

    <p>
        <label for="id04">id04 (disabled)</label>
        <input type="checkbox" id="id04" name="d" checked />
        <switchery
            disabled
            data-checkbox-id="id04"
            data-checkbox-name="d"
            data-name="w4"
            onclick="(function(event, detail) {
                console.log('%cswitchery.onclick', 'background-color:green', JSON.stringify(detail))
            });"
        ></switchery>
    </p>

    </form>

    <script type="module">
    import "../src/assets/Switchery.scss";
    import "../src/Switchery";
    </script>

</body>

</html>
